<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENT Listing Spread</title>
<style>
  :root {
    --surface: #fcfcfb; --text-1: #0b0b0b; --text-2: #52514e; --grid: #ecebe7; --border: #dcdbd6;
    --mexc: #2a78d6; --gate: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --text-1: #ffffff; --text-2: #c3c2b7; --grid: #2a2a28; --border: #3a3a37;
      --mexc: #3987e5; --gate: #d95926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text-1);
         font: 14px/1.5 -apple-system, "PingFang TC", "PingFang SC", system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-2); margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .gap { width: 16px; }
  button { font: inherit; padding: 4px 12px; border: 1px solid var(--border); border-radius: 6px;
           background: transparent; color: var(--text-1); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--text-1); color: var(--surface); }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .sw.hollow { background: transparent !important; border: 2px solid; }
  #readout { color: var(--text-2); font-variant-numeric: tabular-nums; min-height: 42px; white-space: pre; overflow-x: auto; }
  #chart { width: 100%; height: 520px; }
  .note { color: var(--text-2); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="bar" style="justify-content:flex-end">
  <button data-lang="en">EN</button><button data-lang="zh-TW">繁中</button><button data-lang="zh-CN">简中</button>
</div>
<h1 data-i18n="title"></h1>
<p class="sub" data-i18n="sub"></p>

<div class="bar">
  <span data-i18n="period"></span>
  <button data-tf="1" data-i18n="m1"></button><button data-tf="5" aria-pressed="true" data-i18n="m5"></button><button data-tf="15" data-i18n="m15"></button>
  <span class="gap"></span>
  <button data-ex="mexc" aria-pressed="true"><span class="key"><span class="sw" style="background:var(--mexc)"></span>MEXC</span></button>
  <button data-ex="gate" aria-pressed="true"><span class="key"><span class="sw" style="background:var(--gate)"></span>Gate</span></button>
</div>
<div class="bar" style="color:var(--text-2)">
  <span class="key"><span class="sw" style="background:var(--text-2)"></span><span data-i18n="up"></span></span>
  <span class="key"><span class="sw hollow" style="border-color:var(--text-2)"></span><span data-i18n="down"></span></span>
</div>
<div id="readout"></div>
<div id="chart"></div>
<p class="note" data-i18n="note"></p>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const RAW = __DATA__;
const I18N = {
  "en": {
    title: "$CENT listing day: MEXC vs Gate",
    sub: "2026-10-12 from the 17:00 open, UTC+8. Candles are built from raw trades.",
    period: "Period", m1: "1m", m5: "5m", m15: "15m",
    up: "Filled = closed up", down: "Hollow = closed down",
    hint: "Hover the chart to compare both exchanges",
    o: "O", h: "H", l: "L", c: "C", vol: "Vol", none: "no trades",
    note: "Prices in USDT. MEXC reports trades to the second with no trade id, so open and close within a 1m candle may be off; Gate is ordered by trade id.",
  },
  "zh-TW": {
    title: "$CENT 上幣當天：MEXC 對 Gate",
    sub: "2026-10-12 17:00 開盤起，UTC+8；K 線由逐筆成交自算",
    period: "週期", m1: "1 分", m5: "5 分", m15: "15 分",
    up: "實心＝收漲", down: "空心＝收跌",
    hint: "滑鼠移到圖上看兩所 OHLC",
    o: "開", h: "高", l: "低", c: "收", vol: "成交額", none: "無成交",
    note: "單位 USDT。MEXC 成交時間只到秒且沒有成交編號，1 分 K 的開收盤可能有誤差；Gate 依成交編號排序。",
  },
  "zh-CN": {
    title: "$CENT 上币当天：MEXC 对 Gate",
    sub: "2026-10-12 17:00 开盘起，UTC+8；K 线由逐笔成交自算",
    period: "周期", m1: "1 分", m5: "5 分", m15: "15 分",
    up: "实心＝收涨", down: "空心＝收跌",
    hint: "鼠标移到图上看两所 OHLC",
    o: "开", h: "高", l: "低", c: "收", vol: "成交额", none: "无成交",
    note: "单位 USDT。MEXC 成交时间只到秒且没有成交编号，1 分 K 的开收盘可能有误差；Gate 按成交编号排序。",
  },
};
function pickLang() {
  try { const s = localStorage.getItem("lang"); if (I18N[s]) return s; } catch (e) {}
  const n = (navigator.language || "en").toLowerCase();
  if (n.startsWith("zh")) return /tw|hk|mo|hant/.test(n) ? "zh-TW" : "zh-CN";
  return "en";
}
let lang = pickLang();
const T = k => I18N[lang][k];

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NAMES = { mexc: "MEXC", gate: "Gate" };

const chart = LightweightCharts.createChart(document.getElementById("chart"), {
  autoSize: true,
  layout: { background: { color: css("--surface") }, textColor: css("--text-2"), fontSize: 12 },
  grid: { vertLines: { visible: false }, horzLines: { color: css("--grid") } },
  rightPriceScale: { borderVisible: false },
  timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  // fixed HH:MM so the crosshair label does not follow the browser locale (all data is one day)
  localization: { timeFormatter: t => new Date(t * 1000).toISOString().slice(11, 16) },
});

// one hue per exchange; filled = up, hollow = down, so color only carries identity
const series = {};
for (const ex of ["mexc", "gate"]) {
  const c = css("--" + ex);
  series[ex] = chart.addCandlestickSeries({
    upColor: c, downColor: "rgba(0,0,0,0)", borderUpColor: c, borderDownColor: c,
    wickUpColor: c, wickDownColor: c,
    priceFormat: { type: "price", precision: 6, minMove: 0.000001 },
    lastValueVisible: true, priceLineVisible: false, title: NAMES[ex],
  });
}

function resample(bars, tf) {
  if (tf === 1) return bars;
  const out = [];
  for (const b of bars) {
    const t = Math.floor(b.time / (tf * 60)) * tf * 60, last = out[out.length - 1];
    if (last && last.time === t) {
      last.high = Math.max(last.high, b.high); last.low = Math.min(last.low, b.low);
      last.close = b.close; last.usdt += b.usdt;
    } else out.push({ ...b, time: t });
  }
  return out;
}

let tf = 5, cur = {}, lastTime = null;
function draw() {
  for (const ex in series) { cur[ex] = resample(RAW[ex], tf); series[ex].setData(cur[ex]); }
  // pad 3% of the bars (at least 2) on each side so the first time label is not clipped at any period
  const n = Math.max(cur.mexc.length, cur.gate.length), pad = Math.max(2, Math.round(n * 0.03));
  chart.timeScale().setVisibleLogicalRange({ from: -pad, to: n + pad });
}

const fmt = v => v.toFixed(6), hm = t => new Date(t * 1000).toISOString().slice(11, 16);
const readout = document.getElementById("readout");
function showReadout() {
  if (lastTime === null) { readout.textContent = T("hint"); return; }
  const lines = [hm(lastTime)];
  for (const ex in series) {
    const b = cur[ex].find(x => x.time === lastTime);
    lines.push(b ? `${NAMES[ex].padEnd(5)} ${T("o")} ${fmt(b.open)}  ${T("h")} ${fmt(b.high)}  ${T("l")} ${fmt(b.low)}  ${T("c")} ${fmt(b.close)}  ${T("vol")} ${Math.round(b.usdt).toLocaleString()} USDT`
                 : `${NAMES[ex].padEnd(5)} ${T("none")}`);
  }
  readout.textContent = lines.join("\n");
}
chart.subscribeCrosshairMove(p => { if (p.time) { lastTime = p.time; showReadout(); } });

function applyLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = T(el.dataset.i18n));
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  document.title = T("title");
  showReadout();
}

document.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => applyLang(b.dataset.lang));
document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-tf]").forEach(x => x.setAttribute("aria-pressed", x === b));
  tf = +b.dataset.tf; lastTime = null; draw(); showReadout();
});
document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => {
  const on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", on); series[b.dataset.ex].applyOptions({ visible: on });
});

draw();
applyLang(lang);
</script>
</body>
</html>
